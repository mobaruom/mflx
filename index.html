<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Perso">
<title>Perso</title>
<link rel="manifest" id="manifest-link">
<link rel="icon" id="favicon">
<link rel="apple-touch-icon" id="apple-icon">
<style>
:root{
  --bg:#0b1220;--bg2:#0f172a;--card:#15203a;--card-hover:#1b2844;
  --text:#e6eefc;--muted:#8592ad;--accent:#38bdf8;--green:#22c55e;
  --yellow:#f59e0b;--red:#ef4444;--border:#223050;--radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:15px;line-height:1.4;display:flex;flex-direction:column;
  min-height:100vh;min-height:100dvh;overscroll-behavior-y:contain;
}
#app{flex:1;display:flex;flex-direction:column;max-width:900px;width:100%;margin:0 auto;
  padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{
  position:sticky;top:0;background:rgba(11,18,32,.92);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  border-bottom:1px solid var(--border);z-index:10;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px}
header .brand{font-size:11px;color:var(--muted);font-weight:600}
main{padding:16px;flex:1}
nav.tabbar{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(15,23,42,.96);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--border);display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:2px;
  z-index:20;overflow-x:auto;scrollbar-width:none;
}
nav.tabbar::-webkit-scrollbar{display:none}
nav.tabbar button{
  flex:1 0 auto;min-width:42px;background:transparent;border:none;
  color:var(--muted);padding:5px 2px;border-radius:10px;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  font-size:9px;font-family:inherit;cursor:pointer;font-weight:500;
}
nav.tabbar button .ico{font-size:18px;line-height:1}
nav.tabbar button.active{color:var(--accent);background:rgba(56,189,248,.1)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;font-weight:700}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.btn{
  background:var(--accent);color:#001018;border:none;
  padding:9px 14px;border-radius:10px;font-family:inherit;
  font-size:14px;font-weight:600;cursor:pointer;line-height:1;
}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn.small{padding:6px 10px;font-size:12px}
.btn.danger{background:var(--red);color:#fff}
.btn.green{background:var(--green);color:#001018}
input,textarea,select{
  background:var(--bg2);color:var(--text);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;font-family:inherit;
  font-size:14px;width:100%;outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
label.field{display:block;margin-bottom:10px}
label.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
details.add-form{margin-bottom:12px}
details.add-form>summary{
  cursor:pointer;list-style:none;background:var(--card);
  border:1px dashed var(--border);border-radius:var(--radius);
  padding:12px;text-align:center;color:var(--accent);
  font-weight:600;font-size:14px;
}
details.add-form>summary::-webkit-details-marker{display:none}
details.add-form[open]>summary{margin-bottom:10px;border-style:solid}
.grid{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.pill.todo{background:rgba(245,158,11,.15);color:var(--yellow)}
.pill.doing{background:rgba(56,189,248,.15);color:var(--accent)}
.pill.done{background:rgba(34,197,94,.15);color:var(--green)}
.pill.a_voir{background:rgba(245,158,11,.15);color:var(--yellow)}
.pill.en_cours{background:rgba(56,189,248,.15);color:var(--accent)}
.pill.vu{background:rgba(34,197,94,.15);color:var(--green)}
.bar{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.bar.green>div{background:var(--green)}
.bar.warn>div{background:var(--yellow)}
.bar.danger>div{background:var(--red)}
.item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:10px}
.item .title{font-weight:600;font-size:14px}
.item .meta{font-size:12px;color:var(--muted);margin-top:4px}
.item .actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.icon-btn{background:transparent;border:1px solid var(--border);color:var(--muted);
  width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover{color:var(--text);border-color:var(--muted)}
.actions button{font-size:12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.cal-dow{text-align:center;font-size:11px;color:var(--muted);padding:4px 0;font-weight:600}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:8px;cursor:pointer;font-size:13px;border:1px solid transparent;
  position:relative;background:var(--card)}
.cal-day.empty{background:transparent;cursor:default}
.cal-day.today{border-color:var(--accent)}
.cal-day.selected{background:var(--accent);color:#001018;font-weight:700}
.cal-day.has-events::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.cal-day.selected.has-events::after{background:#001018}
.stars{font-size:20px;cursor:pointer;user-select:none;letter-spacing:2px;line-height:1}
.stars .on{color:var(--yellow)}
.stars .off{color:var(--muted)}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.stat .v{font-size:20px;font-weight:700;margin-top:2px}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.dash-grid{grid-template-columns:1fr}}
.dash-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;cursor:pointer;transition:background .15s}
.dash-card:hover{background:var(--card-hover)}
.dash-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dash-card .head .muted{font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.dash-card .num{font-size:26px;font-weight:700;line-height:1.1}
.dash-card .sub{font-size:12px;color:var(--muted);margin-top:2px}
.empty{text-align:center;color:var(--muted);padding:24px 10px;font-size:14px}
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:50%;
  transform:translateX(-50%) translateY(20px);background:var(--green);color:#001018;
  padding:10px 18px;border-radius:10px;font-weight:600;font-size:13px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:100;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
summary.act{list-style:none;display:inline-block;cursor:pointer}
summary.act::-webkit-details-marker{display:none}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">Tableau de bord</h1>
    <span class="brand">PERSO</span>
  </header>
  <main id="view"></main>
  <nav class="tabbar"></nav>
</div>
<script>
/* ============ Data ============ */
const DB_KEY = 'perso_v1';
const defaultData = {
  tasks: [], events: [], goals: [], envelopes: [], media: [], templates: [],
  car: { info: { make:'', model:'', plate:'', year:'' }, entries: [] }
};
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function today(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return (Number(n)||0).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:2}) + ' €'; }
function fmtDate(iso){ if(!iso) return ''; const p=iso.split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : iso; }
function num(n){ return (Number(n)||0).toLocaleString('fr-FR'); }

let data = (function(){
  try {
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return clone(defaultData);
    return Object.assign(clone(defaultData), JSON.parse(raw));
  } catch { return clone(defaultData); }
})();
function save(){ try { localStorage.setItem(DB_KEY, JSON.stringify(data)); } catch(e){ toast('Stockage plein'); } }

/* ============ State ============ */
const state = {
  view: 'dashboard',
  calYear: new Date().getFullYear(),
  calMonth: new Date().getMonth(),
  selectedDay: today(),
  taskFilter: 'all',
  mediaFilter: 'all'
};

const TITLES = {
  dashboard:'Tableau de bord', tasks:'Tâches', calendar:'Calendrier',
  goals:'Objectifs', budget:'Budget', car:'Voiture', media:'Médias', templates:'Templates'
};

/* ============ Render ============ */
function render(){
  document.getElementById('title').textContent = TITLES[state.view];
  document.querySelectorAll('nav.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));
  const v = state.view;
  const map = { dashboard:viewDashboard, tasks:viewTasks, calendar:viewCalendar,
    goals:viewGoals, budget:viewBudget, car:viewCar, media:viewMedia, templates:viewTemplates };
  document.getElementById('view').innerHTML = map[v]();
}

/* ============ Views ============ */
function viewDashboard(){
  const openTasks = data.tasks.filter(t => t.status !== 'done').length;
  const nextEv = [...data.events].filter(e => e.date >= today())
    .sort((a,b)=> ((a.date||'')+' '+(a.time||'')).localeCompare((b.date||'')+' '+(b.time||'')))[0];
  const goalsDone = data.goals.filter(g => Number(g.current) >= Number(g.target)).length;
  const totalBudget = data.envelopes.reduce((s,e)=>s+Number(e.budget||0),0);
  const totalSpent  = data.envelopes.reduce((s,e)=>s+Number(e.spent||0),0);
  const carTotal = (data.car.entries||[]).reduce((s,e)=>s+Number(e.cost||0),0);
  const mediaToWatch = data.media.filter(m => m.status === 'a_voir').length;

  return `
  <div class="dash-grid">
    <div class="dash-card" data-nav="tasks">
      <div class="head"><span class="muted">Tâches ouvertes</span><span>✅</span></div>
      <div class="num">${openTasks}</div>
    </div>
    <div class="dash-card" data-nav="calendar">
      <div class="head"><span class="muted">Prochain événement</span><span>📅</span></div>
      <div style="font-size:14px;font-weight:600">${nextEv ? esc(nextEv.title) : 'Aucun'}</div>
      <div class="sub">${nextEv ? fmtDate(nextEv.date)+(nextEv.time?' · '+esc(nextEv.time):'') : '—'}</div>
    </div>
    <div class="dash-card" data-nav="goals">
      <div class="head"><span class="muted">Objectifs atteints</span><span>🎯</span></div>
      <div class="num">${goalsDone}/${data.goals.length}</div>
    </div>
    <div class="dash-card" data-nav="budget">
      <div class="head"><span class="muted">Budget dépensé</span><span>💶</span></div>
      <div class="num" style="color:${totalSpent>totalBudget?'var(--red)':'var(--green)'}">${money(totalSpent)}</div>
      <div class="sub">sur ${money(totalBudget)}</div>
    </div>
    <div class="dash-card" data-nav="car">
      <div class="head"><span class="muted">Voiture — total</span><span>🚗</span></div>
      <div class="num">${money(carTotal)}</div>
      <div class="sub">${(data.car.entries||[]).length} entrée(s)</div>
    </div>
    <div class="dash-card" data-nav="media">
      <div class="head"><span class="muted">À voir</span><span>🎬</span></div>
      <div class="num">${mediaToWatch}</div>
    </div>
  </div>
  <div style="margin-top:18px">
    <button class="btn ghost" style="width:100%;margin-bottom:8px" data-action="export">⬇ Exporter les données (JSON)</button>
    <button class="btn ghost" style="width:100%;margin-bottom:8px" data-action="import">⬆ Importer (JSON)</button>
    <button class="btn danger" style="width:100%" data-action="reset">Réinitialiser toutes les données</button>
  </div>
  <p class="muted" style="text-align:center;margin-top:18px;font-size:12px">
    Toutes les données restent sur cet appareil (localStorage).
  </p>`;
}

function viewTasks(){
  const f = state.taskFilter;
  const counts = { all: data.tasks.length, todo:0, doing:0, done:0 };
  data.tasks.forEach(t => counts[t.status] = (counts[t.status]||0)+1);
  const list = data.tasks.filter(t => f === 'all' || t.status === f);
  const labels = { todo:'À faire', doing:'En cours', done:'Terminée' };
  const prio = { haute:'🔴 Haute', normale:'🟡 Normale', basse:'🟢 Basse' };

  return `
  <div class="row wrap" style="margin-bottom:12px;gap:6px">
    ${['all','todo','doing','done'].map(k => `
      <button class="btn ${f===k?'':'ghost'} small" data-action="task-filter" data-filter="${k}">
        ${k==='all'?'Toutes':labels[k]} (${counts[k]||0})
      </button>`).join('')}
  </div>
  <details class="add-form">
    <summary>+ Nouvelle tâche</summary>
    <form data-form="task">
      <label class="field"><span>Titre</span><input name="title" required></label>
      <div class="grid">
        <label class="field"><span>Projet</span><input name="project"></label>
        <label class="field"><span>Priorité</span>
          <select name="priority">
            <option value="basse">Basse</option>
            <option value="normale" selected>Normale</option>
            <option value="haute">Haute</option>
          </select>
        </label>
      </div>
      <div class="grid">
        <label class="field"><span>Échéance</span><input type="date" name="due"></label>
        <label class="field"><span>Statut</span>
          <select name="status">
            <option value="todo" selected>À faire</option>
            <option value="doing">En cours</option>
            <option value="done">Terminée</option>
          </select>
        </label>
      </div>
      <button class="btn" type="submit">Ajouter</button>
    </form>
  </details>
  ${list.length ? list.map(t => `
    <div class="item">
      <div class="row between">
        <div class="title" style="${t.status==='done'?'text-decoration:line-through;opacity:.55':''}">${esc(t.title)}</div>
        <span class="pill ${t.status}">${labels[t.status]}</span>
      </div>
      <div class="meta">
        ${t.project ? '📁 '+esc(t.project)+' · ' : ''}
        ${t.due ? '📅 '+fmtDate(t.due)+' · ' : ''}
        ${prio[t.priority] || ''}
      </div>
      <div class="actions">
        ${t.status!=='todo' ? `<button class="btn ghost small" data-action="task-status" data-id="${t.id}" data-status="todo">↩ À faire</button>`:''}
        ${t.status!=='doing'? `<button class="btn ghost small" data-action="task-status" data-id="${t.id}" data-status="doing">▶ En cours</button>`:''}
        ${t.status!=='done' ? `<button class="btn green small" data-action="task-status" data-id="${t.id}" data-status="done">✓ Terminer</button>`:''}
        <button class="btn danger small" data-action="task-del" data-id="${t.id}">🗑</button>
      </div>
    </div>`).join('') : '<div class="empty">Aucune tâche</div>'}`;
}

function viewCalendar(){
  const y = state.calYear, m = state.calMonth;
  const first = new Date(y, m, 1);
  const startDow = (first.getDay() + 6) % 7;
  const dim = new Date(y, m+1, 0).getDate();
  const monthNames = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const dows = ['L','M','M','J','V','S','D'];
  const eventsByDate = {};
  data.events.forEach(e => { (eventsByDate[e.date] = eventsByDate[e.date]||[]).push(e); });

  let cells = '';
  for(let i=0;i<startDow;i++) cells += '<div class="cal-day empty"></div>';
  for(let d=1; d<=dim; d++){
    const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = ['cal-day'];
    if(iso===today()) cls.push('today');
    if(iso===state.selectedDay) cls.push('selected');
    if(eventsByDate[iso]) cls.push('has-events');
    cells += `<div class="${cls.join(' ')}" data-action="cal-select" data-date="${iso}">${d}</div>`;
  }
  const dayEvents = (eventsByDate[state.selectedDay]||[]).sort((a,b)=>(a.time||'').localeCompare(b.time||''));

  return `
  <div class="row between" style="margin-bottom:12px">
    <button class="icon-btn" data-action="cal-prev" aria-label="précédent">‹</button>
    <div style="font-weight:700">${monthNames[m]} ${y}</div>
    <button class="icon-btn" data-action="cal-next" aria-label="suivant">›</button>
  </div>
  <div class="cal-grid">
    ${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
    ${cells}
  </div>
  <div class="card">
    <h3>${fmtDate(state.selectedDay)}</h3>
    ${dayEvents.length ? dayEvents.map(e=>`
      <div class="item" style="margin-bottom:8px">
        <div class="row between">
          <div>
            <div class="title">${esc(e.title)}</div>
            ${e.time?`<div class="meta">🕐 ${esc(e.time)}</div>`:''}
            ${e.notes?`<div class="meta">${esc(e.notes)}</div>`:''}
          </div>
          <button class="icon-btn" data-action="event-del" data-id="${e.id}">🗑</button>
        </div>
      </div>`).join('') : '<div class="empty" style="padding:10px">Aucun événement ce jour</div>'}
    <details class="add-form" style="margin-top:10px;margin-bottom:0">
      <summary>+ Événement</summary>
      <form data-form="event">
        <label class="field"><span>Titre</span><input name="title" required></label>
        <div class="grid">
          <label class="field"><span>Date</span><input type="date" name="date" value="${state.selectedDay}" required></label>
          <label class="field"><span>Heure</span><input type="time" name="time"></label>
        </div>
        <label class="field"><span>Notes</span><textarea name="notes" rows="2"></textarea></label>
        <button class="btn" type="submit">Ajouter</button>
      </form>
    </details>
  </div>`;
}

function viewGoals(){
  return `
  <details class="add-form">
    <summary>+ Nouvel objectif</summary>
    <form data-form="goal">
      <label class="field"><span>Titre</span><input name="title" required></label>
      <div class="grid">
        <label class="field"><span>Cible</span><input name="target" type="number" step="any" required></label>
        <label class="field"><span>Unité</span><input name="unit" placeholder="€, km, livres…"></label>
      </div>
      <button class="btn" type="submit">Ajouter</button>
    </form>
  </details>
  ${data.goals.length ? data.goals.map(g=>{
    const cur = Number(g.current)||0, tar = Number(g.target)||0;
    const pct = tar>0 ? Math.min(100, (cur/tar)*100) : 0;
    const cls = pct>=100?'green':pct>=60?'':'warn';
    return `
    <div class="card">
      <div class="row between">
        <div>
          <div style="font-weight:700">${esc(g.title)}</div>
          <div class="muted">${cur} / ${tar} ${esc(g.unit||'')} · ${Math.round(pct)}%</div>
        </div>
        <button class="icon-btn" data-action="goal-del" data-id="${g.id}">🗑</button>
      </div>
      <div class="bar ${cls}"><div style="width:${pct}%"></div></div>
      <form data-form="goal-update" data-id="${g.id}" style="display:flex;gap:6px;margin-top:10px">
        <input name="amount" type="number" step="any" placeholder="+ / −" style="flex:1">
        <button class="btn small" type="submit">Ajouter</button>
      </form>
    </div>`;
  }).join('') : '<div class="empty">Aucun objectif</div>'}`;
}

function viewBudget(){
  const tb = data.envelopes.reduce((s,e)=>s+Number(e.budget||0),0);
  const ts = data.envelopes.reduce((s,e)=>s+Number(e.spent||0),0);
  return `
  <div class="totals">
    <div class="stat"><div class="l">Budget total</div><div class="v">${money(tb)}</div></div>
    <div class="stat"><div class="l">Dépensé</div><div class="v" style="color:${ts>tb?'var(--red)':'var(--green)'}">${money(ts)}</div></div>
  </div>
  <details class="add-form">
    <summary>+ Nouvelle enveloppe</summary>
    <form data-form="envelope">
      <label class="field"><span>Nom</span><input name="name" required placeholder="Courses, loisirs…"></label>
      <label class="field"><span>Budget (€)</span><input name="budget" type="number" step="0.01" required></label>
      <button class="btn" type="submit">Ajouter</button>
    </form>
  </details>
  ${data.envelopes.length ? data.envelopes.map(e=>{
    const b = Number(e.budget)||0, s = Number(e.spent)||0;
    const pct = b>0 ? Math.min(100, (s/b)*100) : 0;
    const cls = s>b ? 'danger' : pct>80 ? 'warn' : 'green';
    const exps = (e.expenses||[]).slice(-3).reverse();
    return `
    <div class="card">
      <div class="row between">
        <div>
          <div style="font-weight:700">${esc(e.name)}</div>
          <div class="muted">${money(s)} / ${money(b)} · reste ${money(b-s)}</div>
        </div>
        <button class="icon-btn" data-action="env-del" data-id="${e.id}">🗑</button>
      </div>
      <div class="bar ${cls}"><div style="width:${pct}%"></div></div>
      <details style="margin-top:10px">
        <summary class="btn small ghost act">+ Dépense</summary>
        <form data-form="expense" data-id="${e.id}" style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
          <input name="amount" type="number" step="0.01" placeholder="Montant €" required style="flex:1;min-width:110px">
          <input name="label" placeholder="Libellé" style="flex:2;min-width:140px">
          <button class="btn small" type="submit">OK</button>
        </form>
      </details>
      ${exps.length?`<div class="muted" style="margin-top:8px;font-size:12px;line-height:1.6">${exps.map(x=>`• ${esc(x.label||'dépense')} — ${money(x.amount)} <span style="opacity:.6">${fmtDate(x.date)}</span>`).join('<br>')}</div>`:''}
    </div>`;
  }).join('') : '<div class="empty">Aucune enveloppe</div>'}`;
}

function viewCar(){
  const info = data.car.info || {};
  const entries = [...(data.car.entries||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const total = entries.reduce((s,e)=>s+Number(e.cost||0),0);
  const lastKm = entries.find(e => e.km)?.km;
  const types = { vidange:'🛢️ Vidange', revision:'🔧 Révision', pneus:'🛞 Pneus', ct:'📋 Contrôle technique', reparation:'🔨 Réparation', autre:'📌 Autre' };
  return `
  <div class="card">
    <h3>🚗 Informations véhicule</h3>
    <form data-form="car-info">
      <div class="grid">
        <label class="field"><span>Marque</span><input name="make" value="${esc(info.make||'')}"></label>
        <label class="field"><span>Modèle</span><input name="model" value="${esc(info.model||'')}"></label>
      </div>
      <div class="grid">
        <label class="field"><span>Plaque</span><input name="plate" value="${esc(info.plate||'')}"></label>
        <label class="field"><span>Année</span><input name="year" value="${esc(info.year||'')}"></label>
      </div>
      <button class="btn small" type="submit">Enregistrer</button>
    </form>
  </div>
  <div class="totals">
    <div class="stat"><div class="l">Total dépenses</div><div class="v">${money(total)}</div></div>
    <div class="stat"><div class="l">Dernier km</div><div class="v">${lastKm?num(lastKm):'—'}</div></div>
  </div>
  <details class="add-form">
    <summary>+ Entretien / dépense</summary>
    <form data-form="car-entry">
      <div class="grid">
        <label class="field"><span>Date</span><input type="date" name="date" value="${today()}" required></label>
        <label class="field"><span>Kilométrage</span><input type="number" name="km" placeholder="ex: 85000"></label>
      </div>
      <div class="grid">
        <label class="field"><span>Type</span>
          <select name="type">
            ${Object.entries(types).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}
          </select>
        </label>
        <label class="field"><span>Coût (€)</span><input type="number" step="0.01" name="cost" placeholder="0"></label>
      </div>
      <label class="field"><span>Notes</span><input name="notes" placeholder="Garage, détails…"></label>
      <button class="btn" type="submit">Ajouter</button>
    </form>
  </details>
  ${entries.length ? entries.map(e=>`
    <div class="item">
      <div class="row between">
        <div>
          <div class="title">${types[e.type] || esc(e.type)}</div>
          <div class="meta">
            ${fmtDate(e.date)}
            ${e.km?' · '+num(e.km)+' km':''}
            ${e.cost?' · '+money(e.cost):''}
          </div>
          ${e.notes?`<div class="meta">${esc(e.notes)}</div>`:''}
        </div>
        <button class="icon-btn" data-action="car-del" data-id="${e.id}">🗑</button>
      </div>
    </div>`).join('') : '<div class="empty">Aucune entrée</div>'}`;
}

function viewMedia(){
  const f = state.mediaFilter;
  const labels = { a_voir:'À voir', en_cours:'En cours', vu:'Vu' };
  const list = data.media.filter(m => f==='all' || m.status===f);
  return `
  <div class="row wrap" style="margin-bottom:12px;gap:6px">
    ${['all','a_voir','en_cours','vu'].map(k=>`
      <button class="btn ${f===k?'':'ghost'} small" data-action="media-filter" data-filter="${k}">
        ${k==='all'?'Tous':labels[k]} (${k==='all'?data.media.length:data.media.filter(m=>m.status===k).length})
      </button>`).join('')}
  </div>
  <details class="add-form">
    <summary>+ Nouveau film / série</summary>
    <form data-form="media">
      <label class="field"><span>Titre</span><input name="title" required></label>
      <div class="grid">
        <label class="field"><span>Type</span>
          <select name="type"><option value="film">Film</option><option value="serie">Série</option></select>
        </label>
        <label class="field"><span>Statut</span>
          <select name="status">
            <option value="a_voir" selected>À voir</option>
            <option value="en_cours">En cours</option>
            <option value="vu">Vu</option>
          </select>
        </label>
      </div>
      <label class="field"><span>Notes</span><textarea name="notes" rows="2"></textarea></label>
      <button class="btn" type="submit">Ajouter</button>
    </form>
  </details>
  ${list.length ? list.map(m=>`
    <div class="item">
      <div class="row between">
        <div style="flex:1">
          <div class="title">${m.type==='serie'?'📺':'🎬'} ${esc(m.title)}</div>
          <div class="meta">${labels[m.status]}${m.rating?' · '+ '★'.repeat(m.rating)+'☆'.repeat(5-m.rating):''}</div>
          ${m.notes?`<div class="meta">${esc(m.notes)}</div>`:''}
          <div class="stars" data-action="media-rate" data-id="${m.id}" style="margin-top:6px">
            ${[1,2,3,4,5].map(n=>`<span class="${n<=(m.rating||0)?'on':'off'}" data-rate="${n}">★</span>`).join('')}
          </div>
        </div>
        <button class="icon-btn" data-action="media-del" data-id="${m.id}">🗑</button>
      </div>
      <div class="actions">
        ${m.status!=='a_voir' ? `<button class="btn ghost small" data-action="media-status" data-id="${m.id}" data-status="a_voir">↩ À voir</button>`:''}
        ${m.status!=='en_cours'? `<button class="btn ghost small" data-action="media-status" data-id="${m.id}" data-status="en_cours">▶ En cours</button>`:''}
        ${m.status!=='vu' ? `<button class="btn green small" data-action="media-status" data-id="${m.id}" data-status="vu">✓ Vu</button>`:''}
      </div>
    </div>`).join('') : '<div class="empty">Rien ici</div>'}`;
}

function viewTemplates(){
  return `
  <details class="add-form">
    <summary>+ Nouveau template</summary>
    <form data-form="template">
      <label class="field"><span>Nom</span><input name="name" required></label>
      <label class="field"><span>Contenu</span><textarea name="body" rows="6" required></textarea></label>
      <button class="btn" type="submit">Ajouter</button>
    </form>
  </details>
  ${data.templates.length ? data.templates.map(t=>`
    <div class="card">
      <div class="row between" style="margin-bottom:8px">
        <div style="font-weight:700">${esc(t.name)}</div>
        <button class="icon-btn" data-action="template-del" data-id="${t.id}">🗑</button>
      </div>
      <pre style="white-space:pre-wrap;font-family:inherit;font-size:13px;color:var(--muted);margin:0 0 10px;max-height:180px;overflow:auto">${esc(t.body)}</pre>
      <button class="btn small" data-action="template-copy" data-id="${t.id}">📋 Copier</button>

/* ============ Events ============ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action], [data-nav]');
  if(!t) return;
  if(t.dataset.nav){ state.view = t.dataset.nav; render(); return; }

  const a = t.dataset.action;
  const id = t.dataset.id;

  switch(a){
    case 'task-filter': state.taskFilter = t.dataset.filter; render(); break;
    case 'media-filter': state.mediaFilter = t.dataset.filter; render(); break;
    case 'task-status': {
      const x = data.tasks.find(o=>o.id===id);
      if(x){ x.status = t.dataset.status; save(); render(); }
      break;
    }
    case 'task-del': data.tasks = data.tasks.filter(o=>o.id!==id); save(); render(); break;
    case 'cal-prev': {
      state.calMonth--;
      if(state.calMonth<0){ state.calMonth=11; state.calYear--; }
      state.selectedDay = `${state.calYear}-${String(state.calMonth+1).padStart(2,'0')}-01`;
      render(); break;
    }
    case 'cal-next': {
      state.calMonth++;
      if(state.calMonth>11){ state.calMonth=0; state.calYear++; }
      state.selectedDay = `${state.calYear}-${String(state.calMonth+1).padStart(2,'0')}-01`;
      render(); break;
    }
    case 'cal-select': state.selectedDay = t.dataset.date; render(); break;
    case 'event-del': data.events = data.events.filter(o=>o.id!==id); save(); render(); break;
    case 'goal-del': data.goals = data.goals.filter(o=>o.id!==id); save(); render(); break;
    case 'env-del': data.envelopes = data.envelopes.filter(o=>o.id!==id); save(); render(); break;
    case 'car-del': data.car.entries = data.car.entries.filter(o=>o.id!==id); save(); render(); break;
    case 'media-del': data.media = data.media.filter(o=>o.id!==id); save(); render(); break;
    case 'media-status': {
      const x = data.media.find(o=>o.id===id);
      if(x){ x.status = t.dataset.status; save(); render(); }
      break;
    }
    case 'media-rate': {
      const r = Number(e.target.dataset.rate);
      if(!r) return;
      const x = data.media.find(o=>o.id===id);
      if(x){ x.rating = (x.rating===r) ? 0 : r; save(); render(); }
      break;
    }
    case 'template-del': data.templates = data.templates.filter(o=>o.id!==id); save(); render(); break;
    case 'template-copy': {
      const x = data.templates.find(o=>o.id===id);
      if(x){
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(x.body).then(()=>toast('Copié !')).catch(()=>toast('Copie impossible'));
        } else toast('Copie non supportée');
      }
      break;
    }
    case 'export': exportData(); break;
    case 'import': importData(); break;
    case 'reset': {
      if(confirm('Supprimer TOUTES les données ? Cette action est irréversible.')){
        data = clone(defaultData);
        save();
        render();
        toast('Réinitialisé');
      }
      break;
    }
  }
});

document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]');
  if(!form) return;
  e.preventDefault();
  const type = form.dataset.form;
  const fd = new FormData(form);
  const g = k => String(fd.get(k) ?? '').trim();

  switch(type){
    case 'task':
      data.tasks.push({ id:uid(), title:g('title'), project:g('project'),
        priority:g('priority')||'normale', due:g('due'), status:g('status')||'todo', createdAt:Date.now() });
      break;
    case 'event':
      data.events.push({ id:uid(), title:g('title'), date:g('date'), time:g('time'), notes:g('notes') });
      break;
    case 'goal':
      data.goals.push({ id:uid(), title:g('title'), target:Number(g('target'))||0, current:0, unit:g('unit') });
      break;
    case 'goal-update': {
      const x = data.goals.find(o=>o.id===form.dataset.id);
      if(x) x.current = (Number(x.current)||0) + (Number(g('amount'))||0);
      break;
    }
    case 'envelope':
      data.envelopes.push({ id:uid(), name:g('name'), budget:Number(g('budget'))||0, spent:0, expenses:[] });
      break;
    case 'expense': {
      const env = data.envelopes.find(o=>o.id===form.dataset.id);
      const amt = Number(g('amount'));
      if(env && amt){
        env.spent = (Number(env.spent)||0) + amt;
        env.expenses = env.expenses || [];
        env.expenses.push({ id:uid(), amount:amt, label:g('label'), date:today() });
      }
      break;
    }
    case 'car-info':
      data.car.info = { make:g('make'), model:g('model'), plate:g('plate'), year:g('year') };
      break;
    case 'car-entry':
      data.car.entries.push({ id:uid(), date:g('date'), km: g('km')?Number(g('km')):null,
        type:g('type')||'autre', cost: g('cost')?Number(g('cost')):0, notes:g('notes') });
      break;
    case 'media':
      data.media.push({ id:uid(), title:g('title'), type:g('type')||'film',
        status:g('status')||'a_voir', notes:g('notes'), rating:0 });
      break;
    case 'template':
      data.templates.push({ id:uid(), name:g('name'), body:String(fd.get('body')||'') });
      break;
  }

  save();
  form.reset();
  const d = form.closest('details');
  if(d) d.open = false;
  render();
  toast('Enregistré');
});

/* ============ Utils ============ */
let toastTimer;
function toast(msg){
  let el = document.getElementById('toast');
  if(!el){ el = document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 1600);
}

function exportData(){
  const blob = new Blob([JSON.stringify(data,null,2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `perso-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('Exporté');
}

function importData(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/json';
  inp.onchange = () => {
    const file = inp.files && inp.files[0];
    if(!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const parsed = JSON.parse(String(r.result));
        data = Object.assign(clone(defaultData), parsed);
        save(); render(); toast('Importé');
      } catch { toast('Fichier invalide'); }
    };
    r.readAsText(file);
  };
  inp.click();
}

/* ============ Init ============ */
function initTabbar(){
  const tabs = [
    ['dashboard','🏠','Accueil'],
    ['tasks','✅','Tâches'],
    ['calendar','📅','Agenda'],
    ['goals','🎯','Objectifs'],
    ['budget','💶','Budget'],
    ['car','🚗','Voiture'],
    ['media','🎬','Médias'],
    ['templates','📝','Templates']
  ];
  const bar = document.querySelector('nav.tabbar');
  bar.innerHTML = tabs.map(([v,i,l])=>`<button data-view="${v}"><span class="ico">${i}</span><span>${l}</span></button>`).join('');
  bar.addEventListener('click', e => {
    const b = e.target.closest('button[data-view]');
    if(b){ state.view = b.dataset.view; render(); window.scrollTo({top:0}); }
  });
}

function setupPWA(){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="40" fill="#0b1220"/><circle cx="96" cy="96" r="66" fill="none" stroke="#38bdf8" stroke-width="6"/><text x="96" y="128" font-size="96" font-family="-apple-system,system-ui,sans-serif" font-weight="800" text-anchor="middle" fill="#38bdf8">P</text></svg>`;
  const icon = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);

  document.getElementById('favicon').href = icon;
  document.getElementById('apple-icon').href = icon;

  const manifest = {
    name: 'Perso — Tableau de bord',
    short_name: 'Perso',
    description: 'App perso tout-en-un : tâches, agenda, objectifs, budget, voiture, médias, templates.',
    start_url: '.',
    scope: '.',
    display: 'standalone',
    orientation: 'portrait',
    background_color: '#0b1220',
    theme_color: '#0b1220',
    icons: [
      { src: icon, sizes: '192x192', type: 'image/svg+xml', purpose: 'any' },
      { src: icon, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' },
      { src: icon, sizes: 'any', type: 'image/svg+xml', purpose: 'maskable' }
    ]
  };
  const mb = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  document.getElementById('manifest-link').href = URL.createObjectURL(mb);

  // Tentative best-effort d'enregistrer un service worker (certains navigateurs refusent depuis un blob)
  if('serviceWorker' in navigator){
    const sw = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));self.addEventListener('fetch',()=>{});";
    try {
      const sb = new Blob([sw], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(sb)).catch(()=>{});
    } catch(_){}
  }
}

initTabbar();
setupPWA();
render();
</script>
